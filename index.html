<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile RTS - Epoch 1</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: white; font-family: sans-serif; overflow: hidden; user-select: none; touch-action: none; }
        canvas { display: block; background-color: #3b5928; }
        
        /* Top HUD - Resources */
        #hud { position: absolute; top: 0; left: 0; width: 100%; background: rgba(0,0,0,0.8); padding: 10px; display: flex; justify-content: space-around; align-items: center; font-size: 14px; z-index: 10; border-bottom: 2px solid #555; box-sizing: border-box;}
        .hud-item { font-weight: bold; }
        #epoch-display { color: #f1c40f; text-transform: uppercase; letter-spacing: 1px;}
        
        /* Bottom UI - Actions */
        #action-panel { position: absolute; bottom: 0; left: 0; width: 100%; height: 80px; background: rgba(0,0,0,0.9); border-top: 2px solid #555; display: flex; align-items: center; justify-content: flex-start; padding: 0 10px; overflow-x: auto; box-sizing: border-box; z-index: 10; gap: 10px; }
        
        .action-btn { padding: 10px 15px; background: #34495e; color: white; border: 2px solid #2c3e50; border-radius: 5px; font-weight: bold; cursor: pointer; white-space: nowrap; height: 50px; display: flex; flex-direction: column; justify-content: center; align-items: center;}
        .action-btn:active { background: #2980b9; }
        .cost-text { font-size: 10px; color: #bdc3c7; margin-top: 2px; }
        
        #selection-text { position: absolute; bottom: 85px; left: 10px; font-size: 12px; color: #bdc3c7; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 3px; pointer-events: none;}
    </style>
</head>
<body>

    <div id="hud">
        <span class="hud-item" id="res-food">🍖 200</span>
        <span class="hud-item" id="res-wood">🪵 200</span>
        <span class="hud-item" id="res-gold">🪙 0</span>
        <span class="hud-item" id="epoch-display">Prehistoric Age</span>
    </div>

    <div id="selection-text">Nothing Selected</div>
    <div id="action-panel">
        <!-- Buttons injected here by JS -->
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    // --- GAME STATE ---
    let resources = { food: 200, wood: 200, gold: 0 };
    let epoch = 1; // 1 = Prehistoric, 2 = Copper
    
    // Camera for panning
    let camera = { x: 0, y: 0 };
    const MAP_SIZE = 1500;

    // --- GAME OBJECTS ---
    let units = [];
    let buildings = [];
    let nodes = [];
    
    let selectedObj = null;

    // Setup Initial Map
    buildings.push({ id: 'tc', type: 'townCenter', x: MAP_SIZE/2, y: MAP_SIZE/2, hp: 1000, maxHp: 1000, size: 60, name: "Town Center" });
    
    units.push({ id: 'u1', type: 'citizen', x: MAP_SIZE/2 - 50, y: MAP_SIZE/2 + 50, hp: 50, maxHp: 50, size: 12, state: 'idle', target: null, payload: null, path: null });
    units.push({ id: 'u2', type: 'citizen', x: MAP_SIZE/2 + 50, y: MAP_SIZE/2 + 50, hp: 50, maxHp: 50, size: 12, state: 'idle', target: null, payload: null, path: null });

    // Resource Nodes
    for(let i=0; i<8; i++) {
        nodes.push({ id: 'tree'+i, type: 'wood', x: MAP_SIZE/2 + 150 + Math.random()*200, y: MAP_SIZE/2 - 200 + Math.random()*300, size: 20, stock: 500 });
        nodes.push({ id: 'berry'+i, type: 'food', x: MAP_SIZE/2 - 250 + Math.random()*150, y: MAP_SIZE/2 + 100 + Math.random()*150, size: 15, stock: 300 });
    }
    nodes.push({ id: 'gold1', type: 'gold', x: MAP_SIZE/2 - 100, y: MAP_SIZE/2 - 250, size: 25, stock: 2000 });
    nodes.push({ id: 'gold2', type: 'gold', x: MAP_SIZE/2 + 300, y: MAP_SIZE/2 + 300, size: 25, stock: 2000 });

    // --- TOUCH CONTROLS (PAN & SELECT) ---
    let touchStartX = 0; let touchStartY = 0;
    let camStartX = 0; let camStartY = 0;
    let isDragging = false;

    canvas.addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        camStartX = camera.x;
        camStartY = camera.y;
        isDragging = false;
    });

    canvas.addEventListener('touchmove', e => {
        let dx = e.touches[0].clientX - touchStartX;
        let dy = e.touches[0].clientY - touchStartY;
        if (Math.abs(dx) > 10 || Math.abs(dy) > 10) isDragging = true;
        
        if (isDragging) {
            camera.x = camStartX - dx;
            camera.y = camStartY - dy;
            // Clamp camera
            camera.x = Math.max(0, Math.min(MAP_SIZE - canvas.width, camera.x));
            camera.y = Math.max(0, Math.min(MAP_SIZE - canvas.height, camera.y));
        }
    });

    canvas.addEventListener('touchend', e => {
        if (!isDragging) {
            let worldX = touchStartX + camera.x;
            let worldY = touchStartY + camera.y;
            handleTap(worldX, worldY);
        }
    });

    // Handle mouse for PC testing
    canvas.addEventListener('mousedown', e => { touchStartX = e.clientX; touchStartY = e.clientY; isDragging = false; });
    canvas.addEventListener('mouseup', e => { 
        if(!isDragging) { handleTap(e.clientX + camera.x, e.clientY + camera.y); }
    });

    function handleTap(wx, wy) {
        // 1. If we have a citizen selected, checking if we tapped the ground or a resource to command them
        if (selectedObj && selectedObj.type === 'citizen') {
            // Did we tap a resource?
            let clickedNode = nodes.find(n => Math.hypot(n.x - wx, n.y - wy) < n.size + 15);
            if (clickedNode) {
                selectedObj.target = clickedNode;
                selectedObj.state = 'moving_to_resource';
                updateUI();
                return;
            }
            
            // Did we tap a building?
            let clickedBldg = buildings.find(b => Math.hypot(b.x - wx, b.y - wy) < b.size);
            if (clickedBldg && clickedBldg.type === 'townCenter' && selectedObj.payload) {
                selectedObj.target = clickedBldg;
                selectedObj.state = 'returning_payload';
                return;
            }

            // Otherwise, just move there
            selectedObj.target = { x: wx, y: wy, type: 'ground' };
            selectedObj.state = 'moving';
            updateUI();
            return;
        }

        if (selectedObj && selectedObj.type === 'fighter') {
            selectedObj.target = { x: wx, y: wy, type: 'ground' };
            selectedObj.state = 'moving';
            return;
        }

        // 2. Select an object
        selectedObj = null;
        let found = units.find(u => Math.hypot(u.x - wx, u.y - wy) < u.size + 15);
        if (!found) found = buildings.find(b => Math.hypot(b.x - wx, b.y - wy) < b.size + 10);
        
        selectedObj = found;
        updateUI();
    }

    // --- UI UPDATES ---
    function updateUI() {
        document.getElementById('res-food').innerText = `🍖 ${Math.floor(resources.food)}`;
        document.getElementById('res-wood').innerText = `🪵 ${Math.floor(resources.wood)}`;
        document.getElementById('res-gold').innerText = `🪙 ${Math.floor(resources.gold)}`;
        
        let panel = document.getElementById('action-panel');
        let selText = document.getElementById('selection-text');
        panel.innerHTML = '';

        if (!selectedObj) {
            selText.innerText = "Nothing Selected";
            return;
        }

        if (selectedObj.type === 'townCenter') {
            selText.innerText = "Town Center Selected";
            panel.innerHTML += `
                <div class="action-btn" onclick="act('create_citizen')">
                    Create Citizen <span class="cost-text">50 🍖</span>
                </div>
            `;
            if (epoch === 1) {
                panel.innerHTML += `
                    <div class="action-btn" style="background:#8e44ad; border-color:#9b59b6;" onclick="act('advance_epoch')">
                        Advance Epoch <span class="cost-text">200 🍖 | 200 🪙</span>
                    </div>
                `;
            }
        } 
        else if (selectedObj.type === 'citizen') {
            selText.innerText = "Citizen Selected";
            panel.innerHTML += `
                <div class="action-btn" onclick="act('build_barracks')">
                    Build Barracks <span class="cost-text">150 🪵</span>
                </div>
            `;
        }
        else if (selectedObj.type === 'barracks') {
            selText.innerText = "Barracks Selected";
            let unitName = epoch === 1 ? "Clubman" : "Spearman";
            let fCost = epoch === 1 ? 50 : 80;
            let wCost = epoch === 1 ? 20 : 40;
            panel.innerHTML += `
                <div class="action-btn" onclick="act('create_fighter')">
                    Train ${unitName} <span class="cost-text">${fCost} 🍖 | ${wCost} 🪵</span>
                </div>
            `;
        }
        else if (selectedObj.type === 'fighter') {
            selText.innerText = epoch === 1 ? "Clubman Selected" : "Spearman Selected";
        }
    }

    // --- ACTIONS ---
    window.act = function(action) {
        if (action === 'create_citizen' && resources.food >= 50) {
            resources.food -= 50;
            units.push({ id: 'u'+Date.now(), type: 'citizen', x: selectedObj.x, y: selectedObj.y + 70, hp: 50, maxHp: 50, size: 12, state: 'idle', target: null, payload: null });
        }
        else if (action === 'build_barracks' && resources.wood >= 150) {
            resources.wood -= 150;
            // Build near the citizen
            buildings.push({ id: 'b'+Date.now(), type: 'barracks', x: selectedObj.x + 50, y: selectedObj.y, hp: 500, maxHp: 500, size: 40, name: "Barracks" });
            selectedObj.state = 'idle';
            selectedObj.target = null;
        }
        else if (action === 'create_fighter') {
            let fCost = epoch === 1 ? 50 : 80;
            let wCost = epoch === 1 ? 20 : 40;
            if (resources.food >= fCost && resources.wood >= wCost) {
                resources.food -= fCost; resources.wood -= wCost;
                units.push({ id: 'f'+Date.now(), type: 'fighter', x: selectedObj.x, y: selectedObj.y + 50, hp: 100, maxHp: 100, size: 14, state: 'idle', target: null });
            }
        }
        else if (action === 'advance_epoch' && resources.food >= 200 && resources.gold >= 200) {
            resources.food -= 200; resources.gold -= 200;
            epoch = 2;
            document.getElementById('epoch-display').innerText = "Copper Age";
            document.getElementById('epoch-display').style.color = "#e67e22";
            selectedObj = null; // deselect to refresh UI
        }
        updateUI();
    };

    // --- GAME LOOP ---
    let lastTime = performance.now();
    function loop(now) {
        let dt = (now - lastTime) / 1000;
        lastTime = now;

        // Process Units
        units.forEach(u => {
            if (u.target) {
                let speed = (u.type === 'fighter') ? 80 : 60;
                let tx = u.target.x; let ty = u.target.y;
                let dist = Math.hypot(tx - u.x, ty - u.y);

                if (u.state === 'moving' || u.state === 'moving_to_resource' || u.state === 'returning_payload') {
                    if (dist > u.size + (u.target.size || 5)) {
                        u.x += ((tx - u.x) / dist) * speed * dt;
                        u.y += ((ty - u.y) / dist) * speed * dt;
                    } else {
                        // Reached destination
                        if (u.state === 'moving') {
                            u.state = 'idle'; u.target = null;
                        } 
                        else if (u.state === 'moving_to_resource') {
                            u.state = 'gathering';
                        }
                        else if (u.state === 'returning_payload') {
                            // Drop off resources
                            if (u.payload) {
                                resources[u.payload.type] += u.payload.amt;
                                u.payload = null;
                                updateUI();
                            }
                            // Go back to the node they were mining
                            if (u.lastNode && u.lastNode.stock > 0) {
                                u.target = u.lastNode;
                                u.state = 'moving_to_resource';
                            } else {
                                u.state = 'idle'; u.target = null;
                            }
                        }
                    }
                }
                else if (u.state === 'gathering') {
                    if (u.target.stock > 0) {
                        // Takes time to gather. Fake it by grabbing chunk instantly for this demo scale, then walking back
                        let amt = Math.min(10, u.target.stock);
                        u.target.stock -= amt;
                        u.payload = { type: u.target.type, amt: amt };
                        u.lastNode = u.target;
                        
                        // Find nearest Town Center
                        let tc = buildings.find(b => b.type === 'townCenter');
                        u.target = tc;
                        u.state = 'returning_payload';
                    } else {
                        // Node empty
                        u.state = 'idle'; u.target = null;
                    }
                }
            }
        });

        // Clean up empty nodes
        nodes = nodes.filter(n => n.stock > 0);

        draw();
        requestAnimationFrame(loop);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(-camera.x, -camera.y);

        // Draw Map Border
        ctx.strokeStyle = '#27ae60'; ctx.lineWidth = 5;
        ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

        // Draw Nodes
        nodes.forEach(n => {
            if (n.type === 'wood') { ctx.fillStyle = '#2ecc71'; ctx.beginPath(); ctx.arc(n.x, n.y, n.size, 0, Math.PI*2); ctx.fill(); }
            else if (n.type === 'food') { ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(n.x, n.y, n.size, 0, Math.PI*2); ctx.fill(); }
            else if (n.type === 'gold') { ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(n.x, n.y, n.size, 0, Math.PI*2); ctx.fill(); }
        });

        // Draw Buildings
        buildings.forEach(b => {
            if (b.type === 'townCenter') {
                ctx.fillStyle = epoch === 1 ? '#8e44ad' : '#e67e22'; // Upgrades visually in epoch 2
                ctx.fillRect(b.x - b.size/2, b.y - b.size/2, b.size, b.size);
                ctx.fillStyle = 'white'; ctx.textAlign = 'center'; ctx.font = '12px Arial';
                ctx.fillText(epoch === 1 ? "TC (Prehistoric)" : "TC (Copper)", b.x, b.y + b.size/2 + 15);
            }
            else if (b.type === 'barracks') {
                ctx.fillStyle = '#c0392b';
                ctx.fillRect(b.x - b.size/2, b.y - b.size/2, b.size, b.size);
                ctx.fillStyle = 'white'; ctx.textAlign = 'center'; ctx.font = '12px Arial';
                ctx.fillText("Barracks", b.x, b.y + b.size/2 + 15);
            }

            if (selectedObj === b) {
                ctx.strokeStyle = '#00ff00'; ctx.lineWidth = 2;
                ctx.strokeRect(b.x - b.size/2 - 2, b.y - b.size/2 - 2, b.size + 4, b.size + 4);
            }
        });

        // Draw Units
        units.forEach(u => {
            if (u.type === 'citizen') {
                ctx.fillStyle = epoch === 1 ? '#3498db' : '#2980b9';
                ctx.fillRect(u.x - u.size/2, u.y - u.size/2, u.size, u.size);
                if (u.payload) {
                    ctx.fillStyle = u.payload.type === 'wood' ? '#2ecc71' : (u.payload.type === 'food' ? '#e74c3c' : '#f1c40f');
                    ctx.fillRect(u.x - 4, u.y - u.size - 6, 8, 8); // Display carrying payload
                }
            } else if (u.type === 'fighter') {
                ctx.fillStyle = epoch === 1 ? '#e67e22' : '#d35400'; // Copper spearmen are darker
                ctx.beginPath(); ctx.arc(u.x, u.y, u.size, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'white'; ctx.fillText(epoch === 1 ? "🏏" : "🔱", u.x-6, u.y+4); // Club vs Spear
            }

            if (selectedObj === u) {
                ctx.strokeStyle = '#00ff00'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(u.x, u.y, u.size + 4, 0, Math.PI*2); ctx.stroke();
            }
        });

        ctx.restore();
    }

    updateUI();
    loop(performance.now());
</script>
</body>
</html>
